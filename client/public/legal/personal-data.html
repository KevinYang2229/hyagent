<body><h1>個人資料蒐集告知事項（示範內容）</h1><p class="notice">本頁為開發測試用假資料，不構成正式法律文件。</p><h2>蒐集目的與類別</h2><p>為受理申請、聯絡、審核、紀錄及服務改善，可能蒐集姓名、聯絡方式、身分識別資料與申請內容。</p><h2>利用期間與對象</h2><p>資料僅於服務所需期間由授權人員處理；正式保存期限與聯絡窗口應於上線前補齊。</p></body></html>
