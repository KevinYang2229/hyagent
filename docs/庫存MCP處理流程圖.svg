<svg xmlns="http://www.w3.org/2000/svg" width="980" height="880" viewBox="0 0 980 880" role="img"><title>庫存 MCP 處理流程圖</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" fill="#1e293b"><text x="32" y="40" font-size="25" font-weight="bold">庫存 MCP 處理流程圖</text><rect x="100" y="88" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="124" text-anchor="middle" font-size="18">使用者詢問商品庫存</text><path d="M390 148 L390 176" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="176" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="212" text-anchor="middle" font-size="18">HyAgent 檢查權限並整理條件</text><path d="M390 236 L390 264" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="264" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="300" text-anchor="middle" font-size="18">MCP Client 發送 inventory_query</text><path d="M390 324 L390 352" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="352" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="388" text-anchor="middle" font-size="18">庫存 MCP Server 驗證身分並查詢</text><path d="M390 412 L390 440" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="440" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="476" text-anchor="middle" font-size="18">Client 接收結果，HyAgent 顯示表格</text><path d="M390 500 L390 528" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="528" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="564" text-anchor="middle" font-size="18">使用者要求補貨，HyAgent 顯示確認卡片</text><path d="M390 588 L390 616" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="616" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="652" text-anchor="middle" font-size="18">確認後驗證參數，Client 呼叫補貨工具</text><path d="M390 676 L390 704" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="100" y="704" width="580" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="390" y="740" text-anchor="middle" font-size="18">MCP Server 建立補貨單並回傳結果</text><path d="M680 206 L740 206" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="744" y="180" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="844" y="212" text-anchor="middle" font-size="18">未授權：拒絕使用</text><path d="M680 558 L740 558" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><rect x="744" y="532" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="844" y="564" text-anchor="middle" font-size="18">取消：不執行補貨</text><text x="100" y="832" font-size="16">MCP Client 位於 HyAgent 後端；MCP Server 為獨立庫存服務。</text></g></svg>