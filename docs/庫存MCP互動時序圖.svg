<svg xmlns="http://www.w3.org/2000/svg" width="980" height="970" viewBox="0 0 980 970" role="img"><title>庫存 MCP Client / Server 互動時序圖</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, PingFang TC, Microsoft JhengHei, sans-serif" fill="#1e293b"><text x="32" y="40" font-size="25" font-weight="bold">庫存 MCP Client / Server 互動時序圖</text><rect x="20" y="76" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="120" y="110" text-anchor="middle" font-size="18">使用者</text><path d="M120 132 L120 900" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="260" y="76" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="360" y="110" text-anchor="middle" font-size="18">HyAgent</text><path d="M360 132 L360 900" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="500" y="76" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="600" y="110" text-anchor="middle" font-size="18">MCP Client</text><path d="M600 132 L600 900" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="740" y="76" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="840" y="110" text-anchor="middle" font-size="18">庫存 MCP Server</text><path d="M840 132 L840 900" stroke="#94a3b8" stroke-dasharray="5 5"/><text x="720" y="168" text-anchor="middle" font-size="14">tools/list：取得工具清單</text><path d="M600 176 L840 176" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="720" y="212" text-anchor="middle" font-size="14">回傳工具規格與讀寫標記</text><path d="M840 220 L600 220" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="240" y="256" text-anchor="middle" font-size="14">詢問庫存</text><path d="M120 264 L360 264" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="480" y="300" text-anchor="middle" font-size="14">檢查權限後執行查詢</text><path d="M360 308 L600 308" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="720" y="344" text-anchor="middle" font-size="14">tools/call：inventory_query</text><path d="M600 352 L840 352" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="720" y="388" text-anchor="middle" font-size="14">驗證身分、查詢資料並回傳</text><path d="M840 396 L600 396" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="480" y="432" text-anchor="middle" font-size="14">回傳庫存結果</text><path d="M600 440 L360 440" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="240" y="476" text-anchor="middle" font-size="14">顯示庫存表格</text><path d="M360 484 L120 484" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="240" y="520" text-anchor="middle" font-size="14">要求補貨</text><path d="M120 528 L360 528" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="240" y="564" text-anchor="middle" font-size="14">呈現確認卡片</text><path d="M360 572 L120 572" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="240" y="608" text-anchor="middle" font-size="14">確認送出</text><path d="M120 616 L360 616" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="480" y="652" text-anchor="middle" font-size="14">驗證權限與參數後執行</text><path d="M360 660 L600 660" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="720" y="696" text-anchor="middle" font-size="14">tools/call：replenishment_create</text><path d="M600 704 L840 704" stroke="#475569" stroke-width="2" fill="none"  marker-end="url(#arrow)"/><text x="720" y="740" text-anchor="middle" font-size="14">建立補貨單並回傳結果</text><path d="M840 748 L600 748" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="480" y="784" text-anchor="middle" font-size="14">回傳補貨單結果</text><path d="M600 792 L360 792" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="240" y="828" text-anchor="middle" font-size="14">顯示結果並記錄稽核</text><path d="M360 836 L120 836" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="32" y="926" font-size="16">Client 位於 HyAgent 後端；請求以 Streamable HTTP 傳送並附簽章 JWT。</text><text x="32" y="952" font-size="16">使用者取消時不呼叫補貨工具；Demo 使用假資料，補貨單儲存於記憶體。</text></g></svg>