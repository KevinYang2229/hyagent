<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1192" viewBox="0 0 1340 1192" role="img" aria-labelledby="inventory-polished-title inventory-polished-desc"><title id="inventory-polished-title">HyAgent 庫存 MCP 處理流程</title><desc id="inventory-polished-desc">使用者透過 HyAgent 內的 MCP Client 呼叫庫存 MCP Server 查詢庫存，確認後建立補貨單並回傳結果。</desc><defs><marker id="mcp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#54738e"/></marker></defs><rect width="1340" height="1192" fill="#ffffff"/><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans CJK TC, Arial, sans-serif"><text x="48" y="44" font-size="13" letter-spacing="2" fill="#688097">HYAGENT · MCP INTEGRATION</text><text x="48" y="90" font-size="34" font-weight="700" fill="#163a62">庫存查詢與補貨處理流程</text><text x="48" y="120" font-size="17" fill="#677d91">先查詢、再確認：由 MCP Client 串接庫存 MCP Server，完成跨系統任務</text><rect x="40" y="148" width="380" height="836" rx="16" fill="#f7f9fc"/><rect x="480" y="148" width="380" height="836" rx="16" fill="#f0f5fc"/><rect x="920" y="148" width="380" height="836" rx="16" fill="#eff8f5"/><text x="60" y="180" font-size="18" font-weight="600" fill="#17334e">使用者</text><text x="500" y="180" font-size="18" font-weight="600" fill="#17334e">HyAgent · LLM 與 MCP Client</text><text x="940" y="180" font-size="18" font-weight="600" fill="#276c61">庫存 MCP Server · store-demo</text><path d="M400 238 H500" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><path d="M670 276 V320" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="688" y="290" width="76" height="23" rx="3" fill="#ffffff"/><text x="694" y="307" font-size="14" fill="#546f86">權限通過</text><path d="M840 358 H940" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="852" y="325" width="108" height="23" rx="3" fill="#ffffff"/><text x="858" y="342" font-size="14" fill="#546f86">MCP 請求</text><path d="M1110 396 V444" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><path d="M940 482 H840" fill="none" stroke="#8396a9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mcp-arrow)"/><rect x="852" y="449" width="76" height="23" rx="3" fill="#ffffff"/><text x="858" y="466" font-size="14" fill="#546f86">回傳結果</text><path d="M500 482 H400" fill="none" stroke="#8396a9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mcp-arrow)"/><rect x="419" y="449" width="44" height="23" rx="3" fill="#ffffff"/><text x="425" y="466" font-size="14" fill="#546f86">顯示</text><path d="M670 520 V592" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="688" y="543" width="76" height="23" rx="3" fill="#ffffff"/><text x="694" y="560" font-size="14" fill="#546f86">要求補貨</text><path d="M500 630 H400" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="419" y="597" width="44" height="23" rx="3" fill="#ffffff"/><text x="425" y="614" font-size="14" fill="#546f86">取消</text><path d="M670 668 V740" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="688" y="692" width="76" height="23" rx="3" fill="#ffffff"/><text x="694" y="709" font-size="14" fill="#546f86">確認送出</text><path d="M840 778 H940" fill="none" stroke="#54738e" stroke-width="2"  marker-end="url(#mcp-arrow)"/><rect x="852" y="745" width="108" height="23" rx="3" fill="#ffffff"/><text x="858" y="762" font-size="14" fill="#546f86">MCP 請求</text><path d="M1110 816 V844 Q1110 852 1102 852 H678 Q670 852 670 860 V884" fill="none" stroke="#8396a9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mcp-arrow)"/><rect x="892" y="821" width="108" height="23" rx="3" fill="#ffffff"/><text x="898" y="838" font-size="14" fill="#546f86">回傳處理結果</text><path d="M500 922 H400" fill="none" stroke="#8396a9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mcp-arrow)"/><rect x="419" y="889" width="44" height="23" rx="3" fill="#ffffff"/><text x="425" y="906" font-size="14" fill="#546f86">回覆</text><rect x="60" y="200" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="80" y="229" fill="#17334e" font-size="20" font-weight="600">01  詢問商品庫存</text><text x="80" y="255" fill="#61758a" font-size="15">例如：哪些商品庫存不足？</text><rect x="500" y="200" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="520" y="229" fill="#17334e" font-size="20" font-weight="600">02  LLM 理解需求與選工具</text><text x="520" y="255" fill="#61758a" font-size="15">HyAgent 檢查權限；LLM 整理查詢條件</text><rect x="500" y="320" width="340" height="76" rx="12" fill="#eaf2ff" stroke="#5178b5" stroke-width="1.5"/><text x="520" y="349" fill="#17334e" font-size="20" font-weight="600">03  MCP Client 發送查詢</text><text x="520" y="375" fill="#61758a" font-size="15">tools/call · inventory_query</text><rect x="940" y="320" width="340" height="76" rx="12" fill="#e8f5f2" stroke="#368276" stroke-width="1.5"/><text x="960" y="349" fill="#17334e" font-size="20" font-weight="600">04  MCP Server 執行查詢</text><text x="960" y="375" fill="#61758a" font-size="15">驗證簽章身分，查詢庫存資料</text><rect x="940" y="444" width="340" height="76" rx="12" fill="#e8f5f2" stroke="#368276" stroke-width="1.5"/><text x="960" y="473" fill="#17334e" font-size="20" font-weight="600">05  產生庫存查詢結果</text><text x="960" y="499" fill="#61758a" font-size="15">庫存數量、到期資訊、建議補貨</text><rect x="500" y="444" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="520" y="473" fill="#17334e" font-size="20" font-weight="600">06  LLM 整理庫存回覆</text><text x="520" y="499" fill="#61758a" font-size="15">Client 回傳資料，HyAgent 顯示表格</text><rect x="60" y="444" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="80" y="473" fill="#17334e" font-size="20" font-weight="600">使用者查看結果</text><text x="80" y="499" fill="#61758a" font-size="15">僅查詢即可結束；需要時要求補貨</text><rect x="500" y="592" width="340" height="76" rx="12" fill="#163a62" stroke="#163a62" stroke-width="1.5"/><text x="520" y="621" fill="#fff" font-size="20" font-weight="600">07  呈現補貨確認卡片</text><text x="520" y="647" fill="#d3e4f6" font-size="15">勾選品項、修改數量與日期</text><rect x="60" y="592" width="340" height="76" rx="12" fill="#fff2ec" stroke="#c77656" stroke-width="1.5"/><text x="80" y="621" fill="#17334e" font-size="20" font-weight="600">取消或不補貨</text><text x="80" y="647" fill="#61758a" font-size="15">停止流程，不呼叫寫入工具</text><rect x="500" y="740" width="340" height="76" rx="12" fill="#eaf2ff" stroke="#5178b5" stroke-width="1.5"/><text x="520" y="769" fill="#17334e" font-size="20" font-weight="600">08  MCP Client 發送補貨</text><text x="520" y="795" fill="#61758a" font-size="15">確認後驗證參數 · replenishment_create</text><rect x="940" y="740" width="340" height="76" rx="12" fill="#e8f5f2" stroke="#368276" stroke-width="1.5"/><text x="960" y="769" fill="#17334e" font-size="20" font-weight="600">09  MCP Server 建立補貨單</text><text x="960" y="795" fill="#61758a" font-size="15">驗證身分與業務規則後寫入</text><rect x="500" y="884" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="520" y="913" fill="#17334e" font-size="20" font-weight="600">10  顯示處理結果與稽核</text><text x="520" y="939" fill="#61758a" font-size="15">LLM 整理結果，HyAgent 顯示與稽核</text><rect x="60" y="884" width="340" height="76" rx="12" fill="#ffffff" stroke="#d2dce7" stroke-width="1.5"/><text x="80" y="913" fill="#17334e" font-size="20" font-weight="600">使用者取得補貨結果</text><text x="80" y="939" fill="#61758a" font-size="15">建立補貨單，不代表已到貨入庫</text><path d="M48 1010 H1292" stroke="#dae2eb"/><rect x="48" y="1030" width="14" height="14" rx="3" fill="#eaf2ff" stroke="#5178b5"/><text x="72" y="1042" font-size="15" fill="#455e75">Client：發送工具呼叫、接收結果</text><rect x="500" y="1030" width="14" height="14" rx="3" fill="#e8f5f2" stroke="#368276"/><text x="524" y="1042" font-size="15" fill="#455e75">Server：提供工具、驗證身分、執行業務</text><text x="48" y="1078" font-size="15" fill="#677d91">控制規則：權限不足即拒絕；寫入須經確認。MCP 採 Streamable HTTP，請求附短效簽章 JWT。</text><text x="48" y="1105" font-size="14" fill="#7b8c9d">現況：Demo 使用假資料，補貨單存於記憶體。正式導入須串接企業庫存系統與持久化儲存。</text><text x="48" y="1140" font-size="15" font-weight="600" fill="#163a62">LLM：理解需求、選擇工具、整理回覆；由 HyAgent 呼叫雲端或地端模型。</text><text x="48" y="1167" font-size="14" fill="#677d91">模型不直接連接 MCP Server；權限檢查、操作確認、工具執行與稽核由 HyAgent 控制。</text></g></svg>