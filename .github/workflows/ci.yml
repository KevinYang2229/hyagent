# CI：push / PR 到 main 時跑 typecheck + 全部測試 + lint。
# 注意：Zeabur 的 CD 不看 CI 結果（push 即部署），CI 紅了代表線上很可能也是壞的，請立即處理。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 取最新 20.x，符合 Expo SDK 57（react-native／metro）要求的 ^20.19.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: 安裝依賴（monorepo 全 workspace）
        run: npm ci

      # mobile/ 是獨立的 npm 工作區（Expo App 用 React 19，不在 root workspace），typecheck／test 會跑 npm --prefix mobile
      # lockfile 以 legacy peer deps 產生（mobile/.npmrc 也有設定），ci 也要用同樣設定才不會判定不同步
      - name: 安裝行動 App 依賴（mobile/ 獨立工作區）
        run: npm ci --prefix mobile --legacy-peer-deps

      - name: Prisma client 生成（server typecheck 依賴生成型別）
        run: npm run db:generate -w server

      - name: Typecheck（ui / sdk / server / client / admin / mcp / mobile）
        run: npm run typecheck

      - name: 測試（server jest + admin/client vitest + mobile jest）
        run: npm test

      - name: Lint
        run: npm run lint

  # 主 verify 只跑 file 模式；db 層（Prisma store / write-through / 加密 / 月分桶）另用
  # 拋棄式 Postgres 跑煙霧驗證，補上 file 測試涵蓋不到的持久化程式碼。
  db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector 而非官方 postgres：0005_knowledge.sql 需要 `create extension vector`，
        # 官方映像沒帶 pgvector，套 migration 會 ERROR: extension "vector" is not available。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oa_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATA_BACKEND: db
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oa_agent_test
      # 開機 fail-fast 需要的最小 env（db-smoke 不實際呼叫 LLM）
      ANTHROPIC_API_KEY: ci-dummy-key
      # 走加密路徑（驗證 BYO key / Session 使用者識別碼落地加密＋讀回解密）
      DATA_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: Prisma client 生成
        run: npm run db:generate -w server

      - name: 套用 migrations（依序）
        run: |
          for f in server/db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: db 煙霧——寫入（8 store）
        run: npm run db:smoke:write -w server

      - name: db 煙霧——重啟還原並斷言
        run: npm run db:smoke:verify -w server
